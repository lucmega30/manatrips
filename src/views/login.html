<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - ManaTrips</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-page {
      min-height: calc(100vh - 130px);
      background: linear-gradient(135deg, #1a3a5c, #00b4d8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .login-card h2 {
      color: #1a3a5c;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .login-card p.subtitulo {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      color: #1a3a5c;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .campo input:focus {
      outline: none;
      border-color: #00b4d8;
    }

    .btn-login {
      width: 100%;
      background-color: #f4623a;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #d94f2a;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
    }

    .login-footer a {
      color: #00b4d8;
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="../images/mtlogonotext.png" alt="ManaTrips Logo" height="100">
      <span>Mana<span style="color: #f4623a;">Trips</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="#">Destinos</a></li>
      <li><a href="#">Contacto</a></li>
      <li><a href="/src/views/login.html">Iniciar Sesión</a></li>
    </ul>
  </nav>

  <!-- LOGIN -->
  <div class="login-page">
    <div class="login-card">
      <h2>Bienvenido de vuelta</h2>
      <p class="subtitulo">Inicia sesión para continuar explorando la República Dominicana.</p>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña">
      </div>

      <button class="btn-login">Iniciar Sesión</button>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
