<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - ManaTrips</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-page {
      min-height: calc(100vh - 130px);
      background: linear-gradient(135deg, #1a3a5c, #00b4d8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .login-card h2 {
      color: #1a3a5c;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .login-card p.subtitulo {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      color: #1a3a5c;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .campo input:focus {
      outline: none;
      border-color: #00b4d8;
    }

    .btn-login {
      width: 100%;
      background-color: #f4623a;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #d94f2a;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
    }

    .login-footer a {
      color: #00b4d8;
      text-decoration: none;
      font-weight: 600;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="logo">
      <img src="../images/mtlogonotext.png" alt="ManaTrips Logo" height="100">
      <span>Mana<span style="color: #f4623a;">Trips</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/">Inicio</a></li>
      <li><a href="/destinos">Destinos</a></li>
     <li><a href="/contacto">Contacto</a></li>
      <li><a href="/login">Iniciar Sesión</a></li>
    </ul>
    <button class="hamburguesa" id="btnHamburguesa" aria-label="Abrir menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- REGISTRO -->
  <div class="login-page">
    <div class="login-card">
      <h2>Crear cuenta</h2>
      <p class="subtitulo">Regístrate para empezar a explorar la República Dominicana.</p>
      
      <div id="mensajeAlerta" style="display: none; padding: 12px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem;"></div>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres">
      </div>

      <button class="btn-login" onclick="registrarse()">Crear cuenta</button>

      <div class="login-footer">
        <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }
  </script>
  <script>
async function registrarse() {
  const nombre = document.getElementById('nombre').value;
  const correo = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const mensaje = document.getElementById('mensajeAlerta');

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.style.display = 'block';
    if (tipo === 'error') {
      mensaje.style.backgroundColor = '#fdecea';
      mensaje.style.color = '#c0392b';
    } else {
      mensaje.style.backgroundColor = '#e8f8f0';
      mensaje.style.color = '#1e8449';
    }
  }

  if (!nombre || !correo || !password) {
    mostrarMensaje('Por favor completa todos los campos.', 'error');
    return;
  }

  try {
    const respuesta = await fetch('/api/usuarios/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, correo, password })
    });

    const datos = await respuesta.json();

    if (respuesta.ok) {
      mostrarMensaje('¡Cuenta creada con éxito! Redirigiendo a inicio de sesión...', 'exito');
      setTimeout(function() {
        window.location.href = '/login';
      }, 1200);
    } else {
      mostrarMensaje(datos.error || datos.errores[0].msg, 'error');
    }
  } catch (error) {
    mostrarMensaje('No se pudo conectar con el servidor.', 'error');
  }
}
  </script>
  <script>
    document.getElementById('btnHamburguesa').addEventListener('click', function() {
      document.querySelector('.nav-links').classList.toggle('activo');
    });
</script>
</body>
</html>
