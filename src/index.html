<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManaTrips - Turismo Dominicano</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="logo">
  <img src="images/mtlogonotext.png" alt="ManaTrips Logo" height="100">
  <span>Mana<span style="color: #f4623a;">Trips</span></span>
</a>
    <ul class="nav-links">
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Destinos</a></li>
      <li><a href="/contacto">Contacto</a></li>
      <li><a href="/login">Iniciar Sesión</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Descubre la República Dominicana</h1>
    <p>Encuentra destinos, compara presupuestos y planifica tu próxima aventura.</p>
    <a href="#" class="btn">Explorar Destinos</a>
  </section>

  <!-- CATEGORIAS -->
  <section class="categorias">
    <h2>¿Qué tipo de experiencia buscas?</h2>
    <div class="cards">
      <div class="card">
        <div class="card-inner">
          <div class="card-front">Playa</div>
          <div class="card-back" style="background-image: url('images/categoria-playa.jpg')">
            <span>Playa</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">Montaña</div>
          <div class="card-back" style="background-image: url('images/categoria-montana.jpg')">
            <span>Montaña</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">Ecoturismo</div>
          <div class="card-back" style="background-image: url('images/categoria-ecoturismo.jpg')">
            <span>Ecoturismo</span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-inner">
          <div class="card-front">Cultura</div>
          <div class="card-back" style="background-image: url('images/categoria-cultura.jpg')">
            <span>Cultura</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
